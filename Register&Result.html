<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reg Form & Result</title>
</head>
<body>
    <h2>Register Form & Result</h2>
    <heaer>
        <nav>
            <a href="">Home</a>
            <a href="">Profile</a>
            <a href="">Login</a>
        </nav>
    </heaer>
    <br>
    <form>
        <table>
            <tr>
                <th>
                    <label>Student Name</label>
                </th>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <th>
                    <label>Email</label>
                </th>
                <td>
                    <input type="email">
                </td>
            </tr>
            <tr>
                <th>
                    <label>Password</label>
                </th>
                <td>
                    <input type="password">
                </td>
            </tr>
            <tr>
                <th>
                    <label>DOB</label>
                </th>
                <td>
                    <input type="date" value="2026-10-05">
                </td>
            </tr>
            <tr>
                <th>
                    <label>Gender</label>
                </th>
                <td>
                    <input type="radio" name="gender" value="male">Male
                    <input type="radio" name="gender" value="Female">Female
                </td>
            </tr>
            <tr>
                <th>
                    <label>Select Your Course</label>
                </th>
                <td>
                <select>
                <optgroup label="Engineering">
                    <option value="CSE">CSE</option>
                        <option value="EEE">EEE</option>
                        <option value="MECH">MECH</option>
                        <option value="AI&DS">AI&DS</option>
                        <option value="ECE">ECE</option>
                        </td>
                </optgroup>
                </select>
            </tr>
            <tr>
                <td colspan="2">
                <input type="submit">
                <input type="reset">
                </td>
            </tr>
        </table>
    </form>
